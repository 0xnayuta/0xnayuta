name: Diag Trophy
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout action source
        uses: actions/checkout@v6
        with:
          repository: Erik-Donath/github-profile-trophy
          ref: feature/generate-svg
          path: act

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run unmodified render_svg.ts via wrapper with dump
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/wrap
          cat > /tmp/wrap/w.ts <<'EOF'
          const dumps = (e: unknown) => {
            const o = e as Record<string, unknown>;
            const out: Record<string, unknown> = { name: (e as Error)?.name, message: (e as Error)?.message, stack: (e as Error)?.stack };
            for (const k of Object.getOwnPropertyNames(o ?? {})) out[k] = o[k];
            return JSON.stringify(out, null, 1).slice(0, 4000);
          };
          try {
            await import("/home/runner/work/0xnayuta/0xnayuta/act/render_svg.ts");
          } catch (e) {
            console.log("WRAPPER_CAUGHT " + dumps(e));
            Deno.exit(42);
          }
          EOF
          deno run --allow-net --allow-env --allow-read --allow-write /tmp/wrap/w.ts "0xnayuta" --file "dist/trophy.svg" --theme "radical" 2>&1 | grep -vE '^(Download|Warning)' 
