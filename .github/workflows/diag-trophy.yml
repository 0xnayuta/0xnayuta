name: Diag Trophy
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Count null repo nodes with GITHUB_TOKEN
        shell: bash
        env:
          GHTOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/q.json <<'EOF'
          {"query":"query userInfo($username: String!) { user(login: $username) { repositories(first: 50, ownerAffiliations: OWNER, orderBy: {direction: DESC, field: STARGAZERS}) { totalCount nodes { createdAt } } } }","variables":{"username":"0xnayuta"}}
          EOF
          curl -sS -H "Authorization: Bearer ${GHTOK}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/q.json \
            https://api.github.com/graphql \
            | python3 -c "import json,sys; d=json.load(sys.stdin); nodes=d['data']['user']['repositories']['nodes']; print('totalCount:', d['data']['user']['repositories']['totalCount']); print('nodes len:', len(nodes)); print('null nodes:', sum(1 for n in nodes if n is None))"

      - name: Run trophy action with SUMMARY_GITHUB_TOKEN
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: radical
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: Verify trophy.svg exists
        run: |
          ls -la dist/trophy.svg && head -c 200 dist/trophy.svg; echo
