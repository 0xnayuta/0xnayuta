name: Diag Trophy
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout action source
        uses: actions/checkout@v6
        with:
          repository: Erik-Donath/github-profile-trophy
          ref: feature/generate-svg
          path: act

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Instrument and run
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          def dumps(e):
              return """JSON.stringify({name: e?.name, message: e?.message, stack: e?.stack, isSoxa: e?.isSoxaError, status: e?.response?.status, data: e?.response?.data}, null, 1)"""
          p = "act/src/Services/GithubApiService.ts"
          s = open(p).read()
          s = s.replace(
            "  } catch {\n    Logger.error(`Error fetching user info for username: ${username}`);",
            '  } catch (e) {\n    console.log("RUI_CAUGHT " + ' + dumps("e") + ');\n    Logger.error(`Error fetching user info for username: ${username}`);'
          )
          s = s.replace(
            "    } catch (error) {\n      if (error.cause instanceof ServiceError) {",
            '    } catch (error) {\n      console.log("EQ_CAUGHT " + ' + dumps("error") + ');\n      if (error.cause instanceof ServiceError) {'
          )
          open(p, "w").write(s)
          p = "act/src/Helpers/Retry.ts"
          s = open(p).read()
          s = s.replace(
            "    } catch (e) {\n      if (e instanceof ServiceError && isLastAttempt) {",
            '    } catch (e) {\n      console.log("CAI_CAUGHT " + ' + dumps("e") + ');\n      if (e instanceof ServiceError && isLastAttempt) {'
          )
          open(p, "w").write(s)
          print("patched")
          PYEOF
          deno run --allow-net --allow-env --allow-read --allow-write act/render_svg.ts "0xnayuta" --file "dist/trophy.svg" --theme "radical" 2>&1 | grep -vE '^(Download|Warning)'
