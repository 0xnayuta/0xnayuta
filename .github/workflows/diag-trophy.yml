name: Diag Trophy
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout action source
        uses: actions/checkout@v6
        with:
          repository: Erik-Donath/github-profile-trophy
          ref: feature/generate-svg
          path: act

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Instrument and run
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: |
          # Instrument request.ts: dump everything on failure
          python3 - <<'PYEOF'
          import re
          p = "act/src/Services/request.ts"
          s = open(p).read()
          s = s.replace(
            "throw handleError(responseData);",
            """{
              const err = handleError(responseData);
              console.log("REQ_FAIL responseData=" + JSON.stringify(responseData).slice(0, 2000));
              console.log("REQ_FAIL err=" + JSON.stringify(Object.assign({name: err.name, message: err.message}, err)));
              throw err;
            }"""
          )
          open(p, "w").write(s)
          p = "act/render_svg.ts"
          s = open(p).read()
          s = s.replace(
            "const svc = new GithubApiService();",
            """console.log("ENV_TYPE=" + Deno.env.get("ENV_TYPE"));
            console.log("DENO_VER=" + Deno.version.deno);
            console.log("TOKEN_PREFIX=" + (Deno.env.get("GITHUB_TOKEN1") || "").slice(0, 10));
            console.log("GITHUB_API=" + Deno.env.get("GITHUB_API"));
            const svc = new GithubApiService();"""
          )
          s = s.replace(
            "if (\n    !(userInfoOrError && (userInfoOrError as any).totalCommits !== undefined)\n  ) {",
            """if (userInfoOrError instanceof Error) { console.log("SVCE_ERR name=" + userInfoOrError.name + " msg=" + (userInfoOrError as any).message + " kind=" + (userInfoOrError as any).kind); }
            if (\n    !(userInfoOrError && (userInfoOrError as any).totalCommits !== undefined)\n  ) {"""
          )
          open(p, "w").write(s)
          print("patched")
          PYEOF
          deno run --allow-net --allow-env --allow-read --allow-write act/render_svg.ts "0xnayuta" --file "dist/trophy.svg" --theme "radical" 2>&1 | grep -vE '^(Download|Warning)'
