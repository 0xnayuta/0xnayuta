name: Diag Pin
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run vendored pin action with GITHUB_TOKEN
        uses: ./.github/readme-stats-action
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=devpiano&theme=radical&hide_border=true&title_color=FF5F6D
          path: dist/pins/devpiano.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run vendored pin action devkit-pi with GITHUB_TOKEN
        uses: ./.github/readme-stats-action
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=devkit-pi&theme=radical&hide_border=true&title_color=FF5F6D
          path: dist/pins/devkit-pi.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check cards
        run: |
          for f in dist/pins/devpiano.svg dist/pins/devkit-pi.svg; do
            if grep -q 'went wrong' "$f"; then echo "$f: ERROR"; else echo "$f: OK ($(wc -c < "$f") bytes)"; fi
          done
