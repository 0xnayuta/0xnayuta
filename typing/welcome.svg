<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 680 50'
    style='background-color: #00000000;'
    width='680px' height='50px'>

    
                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='2500ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h680 ; m0,25 h680 ; m0,25 h0' keyTimes='0;0.64;0.84;1' />
                    </path>
    <text font-family='"Microsoft YaHei", monospace' fill='#FF5F6D' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            这一切都是命运石之门的 Commit
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='2500ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h680 ; m0,25 h680 ; m0,25 h0' keyTimes='0;0.64;0.84;1' />
                    </path>
    <text font-family='"Microsoft YaHei", monospace' fill='#FF5F6D' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            跨越无数个 branch，只为在 main 分支与你相遇
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='2500ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h680 ; m0,25 h680 ; m0,25 h0' keyTimes='0;0.64;0.84;1' />
                    </path>
    <text font-family='"Microsoft YaHei", monospace' fill='#FF5F6D' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            正在观测当前世界线的 Bug 收束率...
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='2500ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h680 ; m0,25 h680 ; m0,25 h0' keyTimes='0;0.64;0.84;1' />
                    </path>
    <text font-family='"Microsoft YaHei", monospace' fill='#FF5F6D' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path3'>
            正在咏唱禁忌魔法：sudo rm -rf /*
        </textPath>
    </text>
</svg>
